<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Board Base -->
  <rect x="20" y="18" width="88" height="96" rx="14" fill="url(#boardGrad)" filter="url(#shadow)" stroke="#0f172a" stroke-width="3"/>

  <!-- Paper -->
  <rect x="30" y="32" width="68" height="74" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>

  <!-- Paper Lines -->
  <rect x="40" y="48" width="48" height="4" rx="2" fill="#94a3b8"/>
  <rect x="40" y="60" width="40" height="4" rx="2" fill="#94a3b8"/>
  <rect x="40" y="72" width="48" height="4" rx="2" fill="#94a3b8"/>
  <rect x="40" y="84" width="32" height="4" rx="2" fill="#38bdf8"/>

  <!-- Metal Clip Top -->
  <rect x="44" y="10" width="40" height="22" rx="5" fill="url(#clipGrad)" stroke="#0f172a" stroke-width="3" filter="url(#shadow)"/>
  <!-- Clip Hole / Hook -->
  <rect x="54" y="15" width="20" height="8" rx="4" fill="#0369a1" stroke="#0f172a" stroke-width="2"/>
</svg>
