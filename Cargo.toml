[package]
name = "clipon"
version = "0.1.0"
edition = "2021"
description = "超軽量Linuxクリップボードランチャー (Ubuntu 22.04 LTS)"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
x11rb = { version = "0.14.0", features = ["xfixes"] }
evdev = "0.13.2"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"

[dev-dependencies]
tempfile = "3"
